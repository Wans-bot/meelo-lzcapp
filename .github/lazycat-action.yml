version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/meelo.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  # 没有可跟版的上游镜像时用 git：版本号取自 package.yml。
  # 不写会导致 action 报 CONFIG_INVALID（unsupported version source type ""）。
  version_source:
    type: git

build:
  run_buildscript: false

stores:
  official:
    enabled: false
  private:
    enabled: false
