version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/meelo.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: server
build:
  run_buildscript: false

images:
  - id: server
    target: service
    service: server
    source: ghcr.io/arthi-chaud/meelo-server
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh
      - en
  private:
    enabled: false

    sort: semver
    delivery:
      mode: lazycat

  - id: front
    target: service
    service: front
    source: ghcr.io/arthi-chaud/meelo-front
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+
